<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaperio | ファイル復元</title><meta name="theme-color" content="#176c57"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"><script defer src="/lucide.js"></script><script defer src="/app.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="/"><i data-lucide="lock-keyhole-open"></i><span>Kaperio</span><small>ファイル復元</small></a><div class="top-actions"><span class="local-status"><span></span>ローカル</span><button class="icon" id="settings-open" title="設定" aria-label="設定"><i data-lucide="settings-2"></i></button><button class="icon" id="shutdown" title="アプリを終了" aria-label="アプリを終了"><i data-lucide="power"></i></button></div></header>
<div class="workspace">
<aside class="library"><div class="library-heading"><h1>ファイル</h1><button class="icon accent" id="add-files" title="ファイルを追加" aria-label="ファイルを追加"><i data-lucide="plus"></i></button></div><input id="files" type="file" accept=".pdf,.xlsx,.pptx,.docx,.xlsm,.pptm,.docm,.zip" multiple hidden><label class="search"><i data-lucide="search"></i><input id="search" placeholder="ファイル名で検索" aria-label="ファイル名で検索"></label><div class="filter-bar"><select id="filter" aria-label="状態で絞り込み"><option value="all">すべてのファイル</option><option value="locked">未解除</option><option value="ready">開封済み</option><option value="active">処理中</option></select><span id="file-count">0</span></div><nav id="file-list" aria-label="ファイル一覧"></nav><button class="import-button" id="import-bottom"><i data-lucide="file-plus-2"></i>ファイルを追加</button><div class="library-footer"><i data-lucide="hard-drive"></i><span>このPCに保存</span><span class="version">v0.2</span></div></aside>
<main id="main"><section id="empty"><i data-lucide="files"></i><h2>ファイルを追加</h2><button class="primary" id="empty-add"><i data-lucide="plus"></i>ファイルを選択</button><span class="muted">PDF・Excel・PowerPoint・Word・ZIP / 最大100MB</span></section>
<div id="document" hidden><div class="document-heading"><div><div class="eyebrow">DOCUMENT</div><h2 id="document-name"></h2><div class="document-meta"><span id="document-size"></span><span id="document-pages"></span><span id="document-encryption"></span></div></div><div class="inline-actions"><span id="document-badge" class="badge"></span><button class="icon" id="remove-file" title="ライブラリから削除" aria-label="ライブラリから削除"><i data-lucide="trash-2"></i></button></div></div>
<div class="document-layout"><section class="operations"><div class="tabs" role="tablist"><button id="tab-unlock" role="tab" aria-selected="true">開封・復元</button><button id="tab-export" role="tab" aria-selected="false">書き出し</button></div>
<div id="unlock-panel"><div id="ready-state" hidden><div class="success-title"><i data-lucide="circle-check"></i><h3>開封済み</h3></div><div class="inline-actions"><a class="primary" id="unlocked-download"><i data-lucide="download"></i>解除済みPDF</a><button class="icon" id="reveal-password" title="復元したパスワードを表示" aria-label="復元したパスワードを表示"><i data-lucide="eye"></i></button></div><output id="password-result" hidden></output></div>
<div id="locked-state"><div class="segmented" role="group" aria-label="開封方法"><button id="known-mode" class="selected">パスワードを入力</button><button id="recover-mode">パスワードを復元</button></div>
<form id="known-form"><label for="password">パスワード</label><div class="password-field"><input id="password" type="password" autocomplete="off"><button type="button" class="icon" id="toggle-password" title="表示を切り替え" aria-label="パスワード表示を切り替え"><i data-lucide="eye"></i></button></div><button class="primary wide" type="submit"><i data-lucide="lock-keyhole-open"></i>開封して保存</button></form>
<form id="recovery-form" hidden><label for="strategy">探索方法</label><select id="strategy"><option value="mask">文字数・文字種から探索</option><option value="dictionary">候補リストから探索</option><option value="dictionary_rules">候補＋英字大小・末尾数字</option><option value="hybrid_suffix">候補＋末尾の文字探索</option><option value="hybrid_prefix">先頭の文字探索＋候補</option></select><div id="mask-fields"><div class="field-row"><label><span id="min-label">最小文字数</span><input id="min-length" type="number" min="1" max="16" value="4"></label><label><span id="max-label">最大文字数</span><input id="max-length" type="number" min="1" max="16" value="6"></label></div><fieldset class="charset"><legend>文字種</legend><label><input type="checkbox" name="charset" value="lower" checked> a–z</label><label><input type="checkbox" name="charset" value="upper" checked> A–Z</label><label><input type="checkbox" name="charset" value="digits" checked> 0–9</label><label><input type="checkbox" name="charset" value="symbols"> 記号</label></fieldset><div class="field-row" id="fixed-fields"><label>先頭の固定文字<input id="prefix" maxlength="16" autocomplete="off"></label><label>末尾の固定文字<input id="suffix" maxlength="16" autocomplete="off"></label></div></div><div id="dictionary-fields" hidden><div class="label-row"><label for="words">候補リスト（1行1件）</label><button class="icon" type="button" id="load-words" title="UTF-8テキストを読み込み" aria-label="候補リストを読み込み"><i data-lucide="upload"></i></button></div><input id="word-file" type="file" accept=".txt,.dic" hidden><textarea id="words" rows="6" spellcheck="false"></textarea></div><div class="estimate"><span>探索候補（上限）</span><strong id="candidate-count">—</strong></div>
<details><summary>実行設定</summary><div class="field-row"><label>時間上限（分）<input id="minutes" type="number" value="10" min="1" max="1440"></label><label>停止温度（°C）<input id="temperature" type="number" value="80" min="60" max="90"></label></div><label for="workload">GPU負荷</label><select id="workload"><option value="1">低負荷</option><option value="2">標準</option><option value="3">高負荷</option></select><label for="kernel">カーネル</label><select id="kernel"><option value="auto">自動最適化</option><option value="pure">標準カーネル</option></select><label for="devices">デバイスID（空欄で自動）</label><input id="devices" placeholder="1" inputmode="numeric"></details><button class="primary wide" type="submit"><i data-lucide="play"></i>探索を開始</button></form></div></div>
<div id="export-panel" hidden><form id="export-form"><label for="export-kind">出力形式</label><select id="export-kind"><option value="pdf">PDF (.pdf)</option><option value="image_pdf">画像PDF (.pdf)</option><option value="word">Word・ページ画像 (.docx)</option><option value="images">ページ画像 (.zip)</option><option value="text">既存テキスト抽出 (.md)</option></select><div class="field-row" id="image-options"><label>解像度<select id="dpi"><option value="100">100 dpi</option><option value="150">150 dpi</option><option value="200" selected>200 dpi</option><option value="300">300 dpi</option></select></label><label>カラー<select id="color"><option value="color">カラー</option><option value="gray">グレースケール</option></select></label></div><p id="format-note" class="muted"></p><button class="primary wide" type="submit"><i data-lucide="download"></i>書き出す</button></form><h3 class="output-heading">保存済みファイル</h3><div id="outputs"></div></div>
<section class="job-status" aria-live="polite"><div class="status-line"><span id="job-status-label"></span><div class="inline-actions"><button class="icon" id="resume-job" title="探索を再開" aria-label="探索を再開"><i data-lucide="play"></i></button><button class="icon" id="pause-job" title="直近の保存地点で停止" aria-label="探索を一時停止"><i data-lucide="pause"></i></button><button class="icon" id="cancel-job" title="処理を中止" aria-label="処理を中止"><i data-lucide="square"></i></button></div></div><progress id="job-progress" max="100" value="0"></progress><div class="metrics"><div><span>速度</span><strong id="speed">—</strong></div><div><span>GPU温度</span><strong id="gpu-temp">—</strong></div><div><span>探索範囲の進捗</span><strong id="percentage">—</strong></div></div><p id="job-message"></p><div id="warnings"></div></section>
</section><section class="preview"><div class="preview-toolbar"><span>プレビュー</span><div class="page-controls"><button class="icon" id="previous-page" title="前のページ" aria-label="前のページ"><i data-lucide="chevron-left"></i></button><span id="page-indicator">—</span><button class="icon" id="next-page" title="次のページ" aria-label="次のページ"><i data-lucide="chevron-right"></i></button></div></div><div class="preview-body"><div id="locked-preview"><i data-lucide="file-lock-2"></i><span>パスワード保護されたファイル</span></div><div id="contents-preview" hidden></div><img id="page-image" alt="選択したPDFのページ" hidden></div></section></div></div></main></div>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-heading"><h2>設定</h2><button class="icon" type="button" id="settings-close" aria-label="設定を閉じる"><i data-lucide="x"></i></button></div><label for="hashcat-path">Hashcat 実行ファイル</label><input id="hashcat-path" spellcheck="false"><label for="zip2john-path">zip2john 実行ファイル（ZIP探索用・任意）</label><input id="zip2john-path" spellcheck="false"><label>保存先</label><div id="output-path" class="path"></div><div class="inline-actions"><button type="submit" class="primary"><i data-lucide="save"></i>保存</button><button type="button" id="diagnostics"><i data-lucide="cpu"></i>GPU診断</button></div><p><a href="/api/licenses" target="_blank" rel="noopener">ライセンス・第三者表示</a></p><pre id="diagnostics-result" hidden></pre></form></dialog>
<dialog id="remove-dialog"><h2>ライブラリから削除</h2><p id="remove-name"></p><p class="muted">作業用コピーと書き出したファイルを削除します。追加元の原本は残ります。</p><div class="inline-actions"><button id="remove-cancel">キャンセル</button><button class="primary" id="remove-confirm"><i data-lucide="trash-2"></i>削除</button></div></dialog><div id="toast" role="alert" hidden></div><div id="drop-overlay" hidden>ファイルを追加</div>
</body></html>
