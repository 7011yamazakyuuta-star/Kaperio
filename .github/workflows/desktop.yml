name: Desktop Builds
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            executable: dist/Kaperio/Kaperio.exe
          - os: macos-14
            executable: dist/Kaperio.app/Contents/MacOS/Kaperio
          - os: macos-15-intel
            executable: dist/Kaperio.app/Contents/MacOS/Kaperio
          - os: ubuntu-22.04
            executable: dist/Kaperio/Kaperio
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kaperio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements-tested.txt pyinstaller==6.22.3
      - name: Isolate Intel Mac cryptography from Python OpenSSL
        if: matrix.os == 'macos-15-intel'
        run: OPENSSL_STATIC=1 OPENSSL_DIR="$(brew --prefix openssl@3)" python -m pip install --force-reinstall --no-deps --no-cache-dir --no-binary cryptography cryptography==50.0.1
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build native executable
        run: python scripts/build_desktop.py
      - name: Test the frozen executable
        run: python tests/frozen_smoke.py "${{ matrix.executable }}"
      - name: Upload verified native bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kaperio-${{ matrix.os }}
          path: kaperio/dist/releases/*
          if-no-files-found: error
          retention-days: 14
